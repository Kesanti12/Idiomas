<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Italiano — Aprende de verdad</title>
<meta name="theme-color" content="#009246">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app" class="app"></div>

<script src="js/content.js"></script>
<script src="js/srs.js"></script>
<script src="js/app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch(() => {});
    });
    // Cuando un service worker nuevo toma control (tras actualizar app.js/content.js/
    // css), recargar una vez automáticamente — si no, el usuario ve la versión vieja
    // hasta que se le ocurra hacer un hard refresh manual.
    let refreshedOnce = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (refreshedOnce) return;
      refreshedOnce = true;
      window.location.reload();
    });
  }
</script>
</body>
</html>
